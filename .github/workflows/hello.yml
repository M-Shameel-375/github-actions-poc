
name: Hello GitHub Actions

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: echo "Hello from the dev branch!"
      - name: Show runner
        run: echo "Running on Ubuntu"
